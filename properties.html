<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4F46E5">
    <meta name="description" content="AllScan - Scan anything. Know instantly. Free QR code and barcode scanner.">
    <title>AllScan - QR & Barcode Scanner</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- html5-qrcode library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        
        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: #818cf8;
            margin-bottom: 10px;
        }
        
        .tagline {
            color: #94a3b8;
            margin-bottom: 30px;
        }
        
        .scanner-box {
            background: #1e293b;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            border: 2px solid #334155;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }
        
        .btn-primary {
            background: #6366f1;
            color: white;
        }
        
        .btn-primary:hover {
            background: #4f46e5;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
        }
        
        .btn-secondary:hover {
            background: #475569;
        }
        
        #qr-reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 20px;
        }
        
        #qr-reader video {
            width: 100% !important;
            border-radius: 12px;
        }
        
        .hidden {
            display: none !important;
        }
        
        .result-card {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
            border: 1px solid #334155;
        }
        
        .result-type {
            color: #818cf8;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .result-content {
            color: #e2e8f0;
            word-break: break-all;
            margin-bottom: 16px;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .action-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.875rem;
        }
        
        .action-btn.open {
            background: #10b981;
            color: white;
        }
        
        .action-btn.copy {
            background: #3b82f6;
            color: white;
        }
        
        .action-btn.share {
            background: #8b5cf6;
            color: white;
        }
        
        .history-item {
            background: #1e293b;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid #334155;
        }
        
        .history-item:hover {
            background: #334155;
        }
        
        .error-message {
            background: #7f1d1d;
            color: #fca5a5;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #334155;
            border-top: 4px solid #818cf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 10px;
            }
            
            .logo {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Main Screen -->
        <div id="mainScreen">
            <div class="logo">AllScan</div>
            <p class="tagline">Scan anything. Know instantly.</p>
            
            <div class="scanner-box">
                <div style="font-size: 4rem; margin-bottom: 20px;">📷</div>
                <h2 style="margin-bottom: 10px; color: #e2e8f0;">QR & Barcode Scanner</h2>
                <p style="color: #94a3b8; margin-bottom: 20px;">Point your camera at any QR code or barcode</p>
                
                <button class="btn btn-primary" onclick="startScanner()">
                    Start Scanning
                </button>
                
                <button class="btn btn-secondary" onclick="showHistory()">
                    View History
                </button>
            </div>
            
            <p style="color: #64748b; font-size: 0.875rem;">
                🔒 Your camera is only used for scanning. No data is stored on servers.
            </p>
        </div>
        
        <!-- Scanner Screen -->
        <div id="scannerScreen" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <button class="btn btn-secondary" style="width: auto; margin: 0;" onclick="stopScanner()">
                    ← Back
                </button>
                <h2 style="color: #e2e8f0;">Scanner</h2>
                <div style="width: 60px;"></div>
            </div>
            
            <div id="scannerLoading" class="loading-spinner"></div>
            <div id="scannerError" class="error-message hidden"></div>
            <div id="qr-reader"></div>
            
            <div style="margin-top: 20px;">
                <button class="btn btn-secondary" onclick="stopScanner()">
                    Cancel
                </button>
            </div>
        </div>
        
        <!-- Result Screen -->
        <div id="resultScreen" class="hidden">
            <div style="text-align: center; margin-bottom: 20px;">
                <div style="font-size: 3rem; margin-bottom: 10px;">✅</div>
                <h2 style="color: #10b981;">Scan Successful!</h2>
            </div>
            
            <div id="resultContent"></div>
            
            <button class="btn btn-primary" onclick="startScanner()">
                Scan Again
            </button>
            
            <button class="btn btn-secondary" onclick="showMain()">
                Back to Home
            </button>
        </div>
        
        <!-- History Screen -->
        <div id="historyScreen" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <button class="btn btn-secondary" style="width: auto; margin: 0;" onclick="showMain()">
                    ← Back
                </button>
                <h2 style="color: #e2e8f0;">History</h2>
                <button class="btn btn-secondary" style="width: auto; margin: 0;" onclick="clearHistory()">
                    Clear
                </button>
            </div>
            
            <div id="historyContent"></div>
        </div>
    </div>

    <script>
        // Global variables
        let html5QrCode = null;
        let scanHistory = [];
        let currentResult = null;
        
        // Load history from localStorage
        function loadHistory() {
            try {
                const saved = localStorage.getItem('allscan-history');
                if (saved) {
                    scanHistory = JSON.parse(saved);
                }
            } catch (e) {
                console.error('Error loading history:', e);
            }
        }
        
        // Save history to localStorage
        function saveHistory() {
            try {
                localStorage.setItem('allscan-history', JSON.stringify(scanHistory));
            } catch (e) {
                console.error('Error saving history:', e);
            }
        }
        
        // Screen navigation
        function showMain() {
            document.getElementById('mainScreen').classList.remove('hidden');
            document.getElementById('scannerScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('historyScreen').classList.add('hidden');
        }
        
        function showHistory() {
            document.getElementById('mainScreen').classList.add('hidden');
            document.getElementById('scannerScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('historyScreen').classList.remove('hidden');
            renderHistory();
        }
        
        // Start scanner
        async function startScanner() {
            console.log('Starting scanner...');
            
            // Show scanner screen
            document.getElementById('mainScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.add('hidden');
            document.getElementById('historyScreen').classList.add('hidden');
            document.getElementById('scannerScreen').classList.remove('hidden');
            document.getElementById('scannerLoading').classList.remove('hidden');
            document.getElementById('scannerError').classList.add('hidden');
            document.getElementById('qr-reader').innerHTML = '';
            
            try {
                // Check if browser supports camera
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('Your browser does not support camera access. Please use a modern browser like Chrome, Safari, or Firefox.');
                }
                
                // Check for HTTPS
                if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
                    throw new Error('Camera access requires HTTPS. Please use a secure connection.');
                }
                
                // Request camera permission explicitly
                await navigator.mediaDevices.getUserMedia({ video: true })
                    .then(stream => {
                        // Stop the stream immediately - we just needed permission
                        stream.getTracks().forEach(track => track.stop());
                    });
                
                console.log('Camera permission granted');
                
                // Create scanner instance
                html5QrCode = new Html5Qrcode("qr-reader");
                
                const config = {
                    fps: 10,
                    qrbox: { width: 250, height: 250 },
                    aspectRatio: 1.0,
                };
                
                // Start scanning
                await html5QrCode.start(
                    { facingMode: "environment" },
                    config,
                    onScanSuccess,
                    onScanFailure
                );
                
                document.getElementById('scannerLoading').classList.add('hidden');
                console.log('Scanner started successfully');
                
            } catch (error) {
                console.error('Scanner error:', error);
                document.getElementById('scannerLoading').classList.add('hidden');
                
                let errorMessage = 'Unable to start camera. ';
                
                if (error.name === 'NotAllowedError' || error.name === 'PermissionDeniedError') {
                    errorMessage = 'Camera access was denied. Please allow camera access in your browser settings and try again.';
                } else if (error.name === 'NotFoundError') {
                    errorMessage = 'No camera was detected on this device.';
                } else if (error.name === 'NotReadableError') {
                    errorMessage = 'Camera is already in use by another application.';
                } else if (error.message) {
                    errorMessage += error.message;
                }
                
                const errorElement = document.getElementById('scannerError');
                errorElement.textContent = errorMessage;
                errorElement.classList.remove('hidden');
            }
        }
        
        // Stop scanner
        async function stopScanner() {
            try {
                if (html5QrCode) {
                    await html5QrCode.stop();
                    html5QrCode.clear();
                    html5QrCode = null;
                }
            } catch (e) {
                console.error('Error stopping scanner:', e);
            }
            
            showMain();
        }
        
        // Scan success handler
        function onScanSuccess(decodedText, decodedResult) {
            console.log('Scan successful:', decodedText);
            
            // Stop scanner
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    html5QrCode = null;
                }).catch(() => {
                    html5QrCode = null;
                });
            }
            
            // Process the result
            const result = processContent(decodedText);
            currentResult = result;
            
            // Add to history
            scanHistory.unshift({
                ...result,
                timestamp: new Date().toISOString()
            });
            
            // Keep only last 50 items
            if (scanHistory.length > 50) {
                scanHistory.length = 50;
            }
            
            saveHistory();
            
            // Show result
            displayResult(result);
        }
        
        // Scan failure handler (called frequently during scanning)
        function onScanFailure(error) {
            // This is normal - called when no QR code is detected
            // Don't show error to user
        }
        
        // Process scanned content
        function processContent(content) {
            const trimmed = content.trim();
            
            // Check for URL
            try {
                const url = new URL(trimmed);
                
                if (url.protocol === 'mailto:') {
                    return {
                        type: 'email',
                        content: trimmed,
                        action: 'Send Email',
                        actionUrl: trimmed
                    };
                }
                
                if (url.protocol === 'tel:') {
                    return {
                        type: 'phone',
                        content: trimmed,
                        action: 'Call',
                        actionUrl: trimmed
                    };
                }
                
                if (url.hostname.includes('wa.me') || url.hostname.includes('whatsapp')) {
                    return {
                        type: 'whatsapp',
                        content: trimmed,
                        action: 'Open WhatsApp',
                        actionUrl: trimmed
                    };
                }
                
                if (url.hostname.includes('maps.google') || url.hostname.includes('maps.apple')) {
                    return {
                        type: 'location',
                        content: trimmed,
                        action: 'Open Maps',
                        actionUrl: trimmed
                    };
                }
                
                return {
                    type: 'url',
                    content: trimmed,
                    action: 'Open Link',
                    actionUrl: trimmed
                };
            } catch (e) {
                // Not a URL
            }
            
            // Check for email
            if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(trimmed)) {
                return {
                    type: 'email',
                    content: trimmed,
                    action: 'Send Email',
                    actionUrl: `mailto:${trimmed}`
                };
            }
            
            // Check for phone number
            if (/^\+?[\d\s\-()]{10,}$/.test(trimmed)) {
                return {
                    type: 'phone',
                    content: trimmed,
                    action: 'Call',
                    actionUrl: `tel:${trimmed.replace(/[\s\-()]/g, '')}`
                };
            }
            
            // Check for WiFi
            if (trimmed.startsWith('WIFI:')) {
                const wifiData = parseWifi(trimmed);
                return {
                    type: 'wifi',
                    content: `Network: ${wifiData.ssid}\nPassword: ${wifiData.password}`,
                    action: null,
                    actionUrl: null
                };
            }
            
            // Default to text
            return {
                type: 'text',
                content: trimmed,
                action: null,
                actionUrl: null
            };
        }
        
        // Parse WiFi string
        function parseWifi(wifiStr) {
            const params = {};
            const parts = wifiStr.substring(5).split(';');
            
            parts.forEach(part => {
                if (part.includes(':')) {
                    const [key, ...valueParts] = part.split(':');
                    const value = valueParts.join(':');
                    if (key && value) {
                        params[key] = value;
                    }
                }
            });
            
            return {
                ssid: params.S || 'Unknown',
                password: params.P || '',
                security: params.T || 'Unknown'
            };
        }
        
        // Display result
        function displayResult(result) {
            const typeEmojis = {
                'url': '🔗',
                'email': '📧',
                'phone': '📞',
                'whatsapp': '💬',
                'location': '📍',
                'wifi': '📶',
                'text': '📝'
            };
            
            const emoji = typeEmojis[result.type] || '📝';
            
            let html = `
                <div class="result-card">
                    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
                        <span style="font-size: 2rem;">${emoji}</span>
                        <div>
                            <div class="result-type">${result.type.toUpperCase()}</div>
                            <div style="color: #64748b; font-size: 0.875rem;">${result.action || 'Content'}</div>
                        </div>
                    </div>
                    
                    <div class="result-content">${result.content}</div>
                    
                    <div class="action-buttons">
                        ${result.actionUrl ? `
                            <button class="action-btn open" onclick="window.open('${result.actionUrl}', '_blank')">
                                ${result.action}
                            </button>
                        ` : ''}
                        
                        <button class="action-btn copy" onclick="copyToClipboard('${result.content.replace(/'/g, "\\'")}')">
                            Copy
                        </button>
                        
                        <button class="action-btn share" onclick="shareContent('${result.content.replace(/'/g, "\\'")}')">
                            Share
                        </button>
                    </div>
                </div>
            `;
            
            document.getElementById('resultContent').innerHTML = html;
            document.getElementById('scannerScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');
        }
        
        // Copy to clipboard
        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                alert('Copied to clipboard!');
            } catch (e) {
                console.error('Copy failed:', e);
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('Copied to clipboard!');
            }
        }
        
        // Share content
        async function shareContent(text) {
            try {
                if (navigator.share) {
                    await navigator.share({
                        title: 'AllScan Result',
                        text: text
                    });
                } else {
                    await copyToClipboard(text);
                }
            } catch (e) {
                console.error('Share failed:', e);
            }
        }
        
        // Render history
        function renderHistory() {
            const content = document.getElementById('historyContent');
            
            if (scanHistory.length === 0) {
                content.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px;">
                        <div style="font-size: 3rem; margin-bottom: 20px;">📭</div>
                        <h3 style="color: #e2e8f0; margin-bottom: 10px;">No scans yet</h3>
                        <p style="color: #94a3b8;">Your scan history will appear here</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            scanHistory.forEach((item, index) => {
                const timeAgo = formatTimeAgo(item.timestamp);
                html += `
                    <div class="history-item" onclick="viewHistoryItem(${index})">
                        <div style="color: #818cf8; font-size: 0.75rem; margin-bottom: 4px;">${item.type.toUpperCase()}</div>
                        <div style="color: #e2e8f0; font-size: 0.875rem; margin-bottom: 4px;">${truncateText(item.content, 50)}</div>
                        <div style="color: #64748b; font-size: 0.75rem;">${timeAgo}</div>
                    </div>
                `;
            });
            
            content.innerHTML = html;
        }
        
        // View history item
        function viewHistoryItem(index) {
            const item = scanHistory[index];
            if (item) {
                currentResult = item;
                displayResult(item);
            }
        }
        
        // Clear history
        function clearHistory() {
            if (confirm('Clear all scan history?')) {
                scanHistory = [];
                saveHistory();
                renderHistory();
            }
        }
        
        // Format time ago
        function formatTimeAgo(timestamp) {
            const now = new Date();
            const time = new Date(timestamp);
            const diff = Math.floor((now - time) / 1000);
            
            if (diff < 60) return 'Just now';
            if (diff < 3600) return `${Math.floor(diff / 60)} min ago`;
            if (diff < 86400) return `${Math.floor(diff / 3600)} hours ago`;
            return time.toLocaleDateString();
        }
        
        // Truncate text
        function truncateText(text, maxLength) {
            if (text.length <= maxLength) return text;
            return text.substring(0, maxLength) + '...';
        }
        
        // Initialize
        loadHistory();
        showMain();
        
        // Log instructions
        console.log('AllScan initialized');
        console.log('To use camera:');
        console.log('1. Serve this file over HTTPS or localhost');
        console.log('2. Click "Start Scanning"');
        console.log('3. Allow camera access when prompted');
    </script>
</body>
</html>
